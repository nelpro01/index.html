<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AUTO PRESTIGE | Toyota Ist</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080808;
            color: #fff;
            overflow-x: hidden;
        }

        /* Lignes décoratives */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 2px;
            height: 100vh;
            background: linear-gradient(
                transparent,
                #d60000,
                transparent
            );
            opacity: 0.5;
            z-index: -1;
        }

        body::before {
            left: 8%;
        }

        body::after {
            right: 8%;
        }

        /* NAVIGATION */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .logo span {
            color: #e00000;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #e00000;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 60px;
            position: relative;
        }

        .hero-content {
            animation: fadeUp 1.2s ease;
        }

        .hero h1 {
            font-size: clamp(40px, 8vw, 85px);
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #e00000;
        }

        .hero p {
            color: #aaa;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .hero-line {
            width: 100px;
            height: 3px;
            background: #e00000;
            margin: 30px auto;
            animation: lineGrow 1.5s ease;
        }

        /* SECTIONS */
        section {
            padding: 100px 8%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title h2 {
            font-size: 35px;
            letter-spacing: 3px;
        }

        .section-title span {
            color: #e00000;
        }

        .section-title::after {
            content: "";
            display: block;
            width: 60px;
            height: 3px;
            background: #e00000;
            margin: 20px auto;
        }

        /* VEHICULE */
        .car-container {
            max-width: 1100px;
            margin: auto;
            background: #111;
            border: 1px solid #222;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: fadeUp 1s ease;
        }

        .car-info {
            text-align: center;
            margin-bottom: 35px;
        }
