body {

    color: white;
}

/* NAVIGATION */
nav {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 20px 8%;
    background: rgba(0,0,0,0.95);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
    border-bottom: 1px solid #222;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 3px;
}

.logo span {
    color: #e00000;
}

nav ul {
    display: flex;
    gap: 25px;
    list-style: none;
}

nav a {
    color: white;
    text-decoration: none;
}

nav a:hover {
    color: #e00000;
}

/* ACCUEIL */
.hero {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 100px 20px 40px;
}

.hero h1 {
    font-size: clamp(40px, 8vw, 80px);
    letter-spacing: 4px;
}

.hero h1 span {
    color: #e00000;
}

.hero p {
    margin-top: 25px;
    color: #aaa;
    letter-spacing: 3px;
}

.line {
    width: 80px;
    height: 3px;
    background: #e00000;
    margin: 25px auto;
}

/* SECTIONS */
section {
    padding: 90px 8%;
}

.title {
    text-align: center;
    margin-bottom: 45px;
}

.title h2 {
    font-size: 35px;
}

.title span {
    color: #e00000;
}

/* VOITURE */
.car {
    max-width: 1100px;
    margin: auto;
    background: #111;
    padding: 25px;
    border: 1px solid #222;
}

.car-info {
    text-align: center;
    margin-bottom: 25px;
}

.car-info h3 {
    font-size: 35px;
}

.price {
    color: #e00000;
    font-size: 30px;
    font-weight: bold;
    margin-top: 10px;
}

/* IMAGE */
.photo {
    width: 100%;
    height: 500px;
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

.photo img.active {
    display: block;
}

.image-error {
    display: none;
    text-align: center;
    color: #777;
    padding: 20px;
}

.image-error.show {
    display: block;
}

/* BOUTONS */
.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
}

.gallery-btn {
    background: #e00000;
    color: white;
    border: none;
    padding: 12px 25px;
    cursor: pointer;
    font-size: 18px;
}

.gallery-btn:hover {
    background: #b00000;
}

    grid-template-columns: repeat(4, 1fr);

    margin-top: 25px;
}
